<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Registration with Paystack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { color: #1a202c; margin-bottom: 8px; }
        .subtitle { color: #718096; margin-bottom: 30px; }
        .fee-badge {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #2d3748; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; 
            border-radius: 8px; font-size: 16px; transition: border 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.2); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .checkbox-group input { width: auto; }
        .checkbox-group label { margin: 0; font-weight: normal; }
        button {
            width: 100%; padding: 14px; background: #4299e1; color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        button:hover { background: #3182ce; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { 
            margin-top: 20px; padding: 15px; border-radius: 8px; 
            display: none; font-weight: 500;
        }
        .message.success { display: block; background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .message.error { display: block; background: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
        .message.info { display: block; background: #bee3f8; color: #2a69ac; border: 1px solid #90cdf4; }
        .loading { 
            display: none; text-align: center; color: #718096; margin-top: 15px;
        }
        .loading.show { display: block; }
        .test-badge {
            background: #fbd38d;
            color: #7b341e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> GHANA NATIONAL ASSOCIATION OF ADVENTIST STUDENTS</h1>
        <h1> UNIVERSITY OF CAPE COAST</h1>
        <h1> Socialization Trip Registration </h1>
        <p class="subtitle">Register for the upcoming socialization trip</p>
        <div class="fee-badge">💰 Registration Fee: 300.00 GHS</div>

        <form id="registrationForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="full_name" placeholder="e.g., Miriam Danso" required />
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="miriam@example.com" required />
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" placeholder="024XXXXXXX" required />
            </div>

            <div class="form-group">
                <label>Level of Study *</label>
                <select id="level" required>
                    <option value="">Select your level</option>
                    <option value="Level 100">Level 100</option>
                    <option value="Level 200">Level 200</option>
                    <option value="Level 300">Level 300</option>
                    <option value="Level 400">Level 400</option>
                    <option value="Postgrad">Postgraduate</option>
                </select>
            </div>

            <div class="form-group">
                <label>Programme of Study *</label>
                <input type="text" id="programme" placeholder="e.g., BSc Computer Science" required />
            </div>

            <div class="form-group">
                <label>Emergency Contact Name *</label>
                <input type="text" id="emergency_contact_name" placeholder="e.g., Mr. Kwabena Ogyam" required />
            </div>

            <div class="form-group">
                <label>Emergency Contact Phone *</label>
                <input type="tel" id="emergency_contact_phone" placeholder="024XXXXXXX" required />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="emergency_consent" />
                <label>I authorize emergency medical care if needed</label>
            </div>

            <div class="form-group">
                <label>How did you hear about this trip?</label>
                <select id="heard_from">
                    <option value="">Select</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Church">Church</option>
                    <option value="Flyer">Flyer</option>
                    <option value="Friend">Friend</option>
                    
                </select>
            </div>

            <button type="submit" id="submitBtn">Continue to Payment</button>
            <div class="loading" id="loading">⏳ Processing...</div>
        </form>

        <div class="message" id="message"></div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading
            submitBtn.disabled = true;
            loading.classList.add('show');
            messageEl.className = 'message';
            messageEl.textContent = '';
            messageEl.style.display = 'none';

            // Collect data
            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                level: document.getElementById('level').value,
                programme: document.getElementById('programme').value,
                emergency_contact_name: document.getElementById('emergency_contact_name').value,
                emergency_contact_phone: document.getElementById('emergency_contact_phone').value,
                emergency_consent: document.getElementById('emergency_consent').checked,
                heard_from: document.getElementById('heard_from').value,
            };

            console.log('📤 Sending data:', data);

            try {
                const response = await fetch('https://trip-registration.onrender.com/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

                console.log('📥 Response status:', response.status);

                const result = await response.json();
                console.log('📥 Response data:', result);

                if (response.ok) {
                    if (result.payment_url) {
                        console.log('✅ Payment URL:', result.payment_url);
                        messageEl.className = 'message info';
                        messageEl.innerHTML = '✅ Redirecting to Paystack...';
                        messageEl.style.display = 'block';
                        
                        // Redirect to Paystack
                        setTimeout(() => {
                            window.location.href = result.payment_url;
                        }, 1000);
                    } else {
                        console.error('❌ No payment_url in response:', result);
                        messageEl.className = 'message error';
                        messageEl.textContent = '❌ No payment URL returned. Check server logs.';
                        messageEl.style.display = 'block';
                    }
                } else {
                    console.error('❌ Response error:', result);
                    messageEl.className = 'message error';
                    messageEl.textContent = `❌ ${result.error || 'Registration failed'}`;
                    messageEl.style.display = 'block';
                }
            } catch (error) {
                console.error('❌ Network error:', error);
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Network error. Make sure the server is running.';
                messageEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
